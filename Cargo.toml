[package]
name = "kangarootwelve"
version = "0.1.3"
edition = "2024"
resolver = "3"
rust-version = "1.86.0"
authors = ["Anjan Roy <hello@itzmeanjan.in>"]
description = "BlaKE12: Blazing-fast KEccak on 12 rounds"
documentation = "https://github.com/itzmeanjan/kangarootwelve"
readme = "README.md"
repository = "https://github.com/itzmeanjan/kangarootwelve.git"
license = "MIT"
keywords = ["keccak", "xof", "kangarootwelve", "gpu", "high-throughput"]
categories = ["cryptography"]
build = "build.rs"

[dependencies]
turboshake = { version = "=0.5.0", features = ["dev"] }
rayon = { version = "=1.11.0", optional = true, default-features = false }
num_cpus = { version = "=1.17.0", optional = true }

[dev-dependencies]
const-hex = "=1.14.1"
criterion = { version = "=0.8.2", default-features = false }
rand = "=0.9.2"

[features]
multi_threaded = ["dep:rayon", "dep:num_cpus"]
cuda = []

[[bench]]
name = "kangarootwelve"
harness = false

[[example]]
name = "kt128_cuda"
required-features = ["cuda"]
